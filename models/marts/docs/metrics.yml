version: 2

# Cross-model governed metric definitions.
metrics:
  - name: average_order_value
    description: Net revenue across all order statuses divided by total orders, in gold crowns.
    type: ratio
    label: Average order value (gold)
    numerator: total_net_revenue
    denominator: total_orders

  - name: orders_per_purchasing_customer
    description: Total orders divided by distinct customers who placed at least one order.
    type: ratio
    label: Orders per purchasing customer
    numerator: total_orders
    denominator: purchasing_customers
