version: 2

plan:
  name: alembic_brew_operations_slice
  status: approved
  owner: analytics_engineering
  approval:
    approved_by: workshop_owner
    evidence: >
      The workshop owner explicitly requested the two-model Alembic brew slice,
      transformations, ten-column public interface, tests, and exclusions.
  readiness_gate:
    required_absent_models:
      - models/staging/alembic_ops/stg_alembic_ops__brew_events.sql
      - models/marts/fct_brews.sql
    required_absent_properties:
      - stg_alembic_ops__brew_events in models/staging/alembic_ops/_stg_alembic_ops.yml
      - fct_brews in models/marts/docs/fct_brews.yml
    rule: Implementation must stop if either target model or properties entry already exists.
  pre_approval_validation:
    status: passed
    checked_by: workshop_owner
    checks:
      source_and_ref_columns_resolve: passed
      output_origins_match_transformations: passed
      tests_match_post_transformation_data: passed
      properties_and_contracts_match_outputs: passed
      lineage_grain_and_joins_are_coherent: passed
      formulas_and_acceptance_checks_reconcile: passed
      build_selector_covers_planned_models: passed
    findings:
      - The committed raw_brew_events fixture contains 8,000 data rows with unique brew_id values.
      - quality_check normalizes to fail or pass with lower(trim(...)).
      - 71 fixture rows have null brew_duration_minutes; nulls remain null after the integer cast.
      - potion_sku and shop_id are governed by existing dim_potions and dim_shops keys.
      - The fact is a direct one-input projection from staging with no join or grain change.
    unresolved: []
  target:
    root_path: models
    implementation_paths:
      - models/staging/alembic_ops
      - models/marts

request:
  business_outcome: >
    Train governed AI-assisted development by publishing one cleaned brew-event
    staging model and one contracted brew fact at one row per brew.
  requested_products:
    - stg_alembic_ops__brew_events
    - fct_brews
  intended_consumers:
    - workshop trainees
    - analytics engineers
    - governed analytics consumers
  out_of_scope:
    - intermediate models
    - changes to existing semantic YAML
    - new metrics or semantic models
    - imputation of null brew durations
    - changes to existing sales, customer, shop, potion, order, item, or payment models

assumptions_and_decisions:
  - id: brew_duration_nulls
    question: How should null brew durations be handled?
    status: approved
    approved_value: Preserve null values through staging and the public fact.
    owner: workshop_owner
  - id: public_interface
    question: What columns may fct_brews publish?
    status: approved
    approved_value: The exact ten ordered columns specified below.
    owner: workshop_owner
  - id: semantic_scope
    question: Does Day 1 change governed semantic definitions?
    status: approved
    approved_value: No; semantic work is deferred to Day 2.
    owner: workshop_owner

models:
  - name: stg_alembic_ops__brew_events
    layer: staging
    path: models/staging/alembic_ops/stg_alembic_ops__brew_events.sql
    properties_path: models/staging/alembic_ops/_stg_alembic_ops.yml
    materialized: view
    description_requirement: One row per raw brew event with approved typing and quality normalization.
    grain:
      description: one row per brew
      key: [brew_id]
    inputs:
      - source:
          name: alembic_ops
          table: raw_brew_events
    implementation:
      cte_shape: [source, renamed, final]
      joins: forbidden
      filtering: forbidden
      aggregation: forbidden
      transformations:
        - quality_check = lower(trim(quality_check))
        - batch_size = batch_size::integer
        - brew_duration_minutes = brew_duration_minutes::integer
        - brewed_at = brewed_at::timestamp_ntz
        - brew_id, potion_sku, shop_id, cauldron_id, and brewer_name pass through
    output_columns:
      - {name: brew_id, logical_type: varchar, source: raw_brew_events.brew_id}
      - {name: potion_sku, logical_type: varchar, source: raw_brew_events.potion_sku}
      - {name: shop_id, logical_type: varchar, source: raw_brew_events.shop_id}
      - {name: cauldron_id, logical_type: varchar, source: raw_brew_events.cauldron_id}
      - {name: quality_check, logical_type: varchar, derived_from: "lower(trim(raw_brew_events.quality_check))"}
      - {name: brewer_name, logical_type: varchar, source: raw_brew_events.brewer_name}
      - {name: batch_size, logical_type: integer, derived_from: "raw_brew_events.batch_size::integer"}
      - {name: brew_duration_minutes, logical_type: integer, derived_from: "raw_brew_events.brew_duration_minutes::integer"}
      - {name: brewed_at, logical_type: timestamp_ntz, derived_from: "raw_brew_events.brewed_at::timestamp_ntz"}
    properties:
      description: Production batches at one row per brew.
      columns:
        - name: brew_id
          description: Primary key — brew identifier.
          data_tests: [unique, not_null]
    contract:
      enforced: false
    acceptance_checks:
      - Output row count equals raw_brew_events row count.
      - brew_id remains unique and non-null.
      - quality_check contains only fail and pass after normalization.
      - Exactly 71 fixture rows retain null brew_duration_minutes.

  - name: fct_brews
    layer: marts
    path: models/marts/fct_brews.sql
    properties_path: models/marts/docs/fct_brews.yml
    materialized: table
    description_requirement: Contracted brew fact at one row per brew, read directly from staging.
    grain:
      description: one row per brew
      key: [brew_id]
    inputs:
      - ref: stg_alembic_ops__brew_events
    implementation:
      cte_shape: [brew_events, final]
      joins: forbidden
      filtering: forbidden
      aggregation: forbidden
      transformations:
        - Cast every public column to its contract type.
        - brewed_date = brewed_at::date
    output_columns:
      - {name: brew_id, logical_type: varchar, derived_from: "stg_alembic_ops__brew_events.brew_id::varchar"}
      - {name: potion_sku, logical_type: varchar, derived_from: "stg_alembic_ops__brew_events.potion_sku::varchar"}
      - {name: shop_id, logical_type: varchar, derived_from: "stg_alembic_ops__brew_events.shop_id::varchar"}
      - {name: cauldron_id, logical_type: varchar, derived_from: "stg_alembic_ops__brew_events.cauldron_id::varchar"}
      - {name: quality_check, logical_type: varchar, derived_from: "stg_alembic_ops__brew_events.quality_check::varchar"}
      - {name: brewer_name, logical_type: varchar, derived_from: "stg_alembic_ops__brew_events.brewer_name::varchar"}
      - {name: batch_size, logical_type: integer, derived_from: "stg_alembic_ops__brew_events.batch_size::integer"}
      - {name: brew_duration_minutes, logical_type: integer, derived_from: "stg_alembic_ops__brew_events.brew_duration_minutes::integer"}
      - {name: brewed_at, logical_type: timestamp_ntz, derived_from: "stg_alembic_ops__brew_events.brewed_at::timestamp_ntz"}
      - {name: brewed_date, logical_type: date, derived_from: "stg_alembic_ops__brew_events.brewed_at::date"}
    properties:
      description: Brew fact with one row per production batch.
      config:
        contract:
          enforced: true
      columns:
        - name: brew_id
          data_type: varchar
          description: Primary key — brew identifier.
          data_tests: [unique, not_null]
        - name: potion_sku
          data_type: varchar
          description: Foreign key to dim_potions.
          data_tests:
            - relationships:
                arguments: {to: "ref('dim_potions')", field: potion_sku}
        - name: shop_id
          data_type: varchar
          description: Foreign key to dim_shops.
          data_tests:
            - relationships:
                arguments: {to: "ref('dim_shops')", field: shop_id}
        - {name: cauldron_id, data_type: varchar, description: Operational cauldron identifier., data_tests: []}
        - name: quality_check
          data_type: varchar
          description: Lowercased brew quality result.
          data_tests:
            - accepted_values:
                arguments: {values: [fail, pass]}
        - {name: brewer_name, data_type: varchar, description: Name of the brewer., data_tests: []}
        - {name: batch_size, data_type: integer, description: Potion units produced in the batch., data_tests: []}
        - {name: brew_duration_minutes, data_type: integer, description: Brew duration in minutes; nulls remain null., data_tests: []}
        - {name: brewed_at, data_type: timestamp_ntz, description: Brew timestamp., data_tests: []}
        - {name: brewed_date, data_type: date, description: Calendar date derived from brewed_at., data_tests: []}
    contract:
      enforced: true
    acceptance_checks:
      - Output row count equals staging row count and brew_id remains unique and non-null.
      - Contract exposes exactly ten columns in the approved order and types.
      - potion_sku and shop_id relationship tests pass.
      - quality_check contains only fail and pass.
      - Null brew durations are preserved.
      - brewed_date equals brewed_at::date for every row.

semantic_scope:
  status: deferred
  deferred:
    - All changes to _semantic_models.yml and metrics.yml are owned by the Day 2 exercise.

validation:
  build_selector: +fct_brews
  planned_model_count: 2
  planned_properties_file_count: 2
  planned_data_test_count: 7
  required_by_layer: {staging: 1, intermediate: 0, marts: 1}
  structural_checks:
    - Both target models are absent before implementation starts.
    - No unplanned model, column, test, dependency, or semantic change is introduced.
    - fct_brews reads directly from stg_alembic_ops__brew_events.
  commands:
    dependencies: dbt deps
    parse: dbt parse --no-partial-parse
    lint: dbt lint --select stg_alembic_ops__brew_events fct_brews --format human
    build: dbt build --select +fct_brews
  data_checks:
    - Validate 8,000 rows, 8,000 distinct non-null brew IDs, and exact staging-to-fact retention.
    - Validate fail/pass quality values and 71 preserved null durations in the fixture.
    - Validate both governed relationships and brewed_date derivation.

verification:
  status: not_run
  completed_at: null
  dbt_deps: {status: not_run, command: dbt deps}
  dbt_parse: {status: not_run, command: "dbt parse --no-partial-parse"}
  sql_lint: {status: not_run, command: "dbt lint --select stg_alembic_ops__brew_events fct_brews --format human"}
  dbt_build: {status: not_run, command: "dbt build --select +fct_brews", invocation_id: null}
  structural_checks: {status: not_run, findings: []}
  data_checks: {status: not_run, findings: []}
  deviations: []
  ready_for_review: false
