version: 2

plan:
  name: canonical_alembic_procurement_slice
  status: approved
  owner: analytics_engineering
  approval:
    approved_by: workshop_owner
    evidence: User explicitly approved the explained canonical eight-model implementation and full mart interfaces in chat on 2026-10-15.
  pre_approval_validation:
    status: passed
    checked_at: 2026-10-15
    checked_by: dbt_wizard
    checks:
      source_and_ref_columns_resolve: passed
      output_origins_match_transformations: passed
      tests_match_post_transformation_data: passed
      properties_and_contracts_match_outputs: passed
      lineage_grain_and_joins_are_coherent: passed
      formulas_and_acceptance_checks_reconcile: passed
      build_selector_covers_planned_models: passed
    findings:
      - Four raw source grains are unique and non-null in the development fixture: 15 suppliers, 80 ingredients, 406 recipe rows, and 8000 brew events.
      - All profiled supplier, ingredient, recipe, potion, shop, and brew relationships are fully matched.
      - Recipes contain 2-5 ingredients; normalized recipe units match ingredient units with zero mismatches.
      - Standard batch supply cost reconciles as batch_size times the sum of recipe quantity times current ingredient unit cost; no profiled batch cost is null.
      - Normalized ingredient units are bundle, dram, gram, pinch, sprig, and vial; quality_check is fail or pass; harvest_season is autumn, spring, summer, winter, or year-round.
      - brew_duration_minutes has 71 null rows and remains nullable; other planned required brew fields are populated in the profiled fixture.
      - dbt show resolved the repaired source declaration to ANALYTICS.DBT_RFRIEDMAN_MERLIN_DEV_RAW and confirmed 15 supplier rows with 15 distinct supplier IDs.
    unresolved: []

  target:
    track: canonical_reference
    root_path: models

request:
  business_outcome: Publish the validated Alembic procurement and brewing reference solution in canonical dbt layers while preserving models/wizard as an isolated participant workspace.
  requested_products:
    - dim_suppliers at one row per supplier for procurement analysis
    - fct_brews at one row per brew event with estimated standard ingredient supply cost based on recipe quantities and current ingredient unit costs
  intended_consumers:
    - workshop facilitators
    - analytics engineers
    - BI and AI-assisted analytics consumers
  out_of_scope:
    - actual procurement transaction cost
    - margin or profitability
    - production-to-sales allocation
    - Semantic Layer additions
    - changes under models/wizard

authority:
  project_conventions:
    - AGENTS.md
    - docs/merlinco/STYLE_GUIDE.md
    - dbt_project.yml
  source_structure:
    - models/staging/alembic_ops/_alembic_ops__sources.yml
    - docs/merlinco/ERD.md
    - docs/merlinco/DATA_DICTIONARY.md
  target_requirements:
    - docs/prompts/wizard_plan_prompt.md
    - canonical models use unsuffixed names; participant models use __wizard
    - canonical migration is validated against the repaired ANALYTICS.DBT_RFRIEDMAN_MERLIN_DEV_RAW source declaration

  implementation_patterns:
    - models/staging/alembic_ops/stg_alembic_ops__shops.sql
    - models/staging/abra_pos/stg_abra_pos__potions.sql
    - models/intermediate/int_order_items_with_order_context.sql
    - models/marts/dim_shops.sql
    - models/marts/fct_orders.sql
    - macros/to_boolean.sql
    - macros/copper_to_gold.sql
  semantic_definitions:
    - models/marts/_marts.yml
    - models/marts/_semantic_models.yml

evidence:
  sources:
    - relation: alembic_ops.raw_suppliers
      established:
        grain: one row per supplier
        primary_key: [supplier_id]
        important_findings: [15 rows, unique non-null key, reliability rating 1-5, five regions]
    - relation: alembic_ops.raw_ingredients
      established:
        grain: one row per ingredient
        primary_key: [ingredient_id]
        important_findings: [80 rows, unique non-null key, every supplier_id matched, unit cost 4-219 copper, all hazardous encodings map]
    - relation: alembic_ops.raw_potion_ingredients
      established:
        grain: one row per potion and ingredient recipe component
        primary_key: [potion_sku, ingredient_id]
        important_findings: [406 rows, unique non-null composite key, quantity 1-12, every ingredient and potion matched]
    - relation: alembic_ops.raw_brew_events
      established:
        grain: one row per brew event
        primary_key: [brew_id]
        important_findings: [8000 rows, unique non-null key, all recipes and shops matched, 71 null brew durations]
  existing_patterns:
    - path: models/staging/abra_pos/stg_abra_pos__potions.sql
      established: [lower trim categoricals, normalize booleans, preserve copper and derive gold, explicit casts]
    - path: models/intermediate/int_order_items_with_order_context.sql
      established: [imports first, joins in final transformation, explicit ordered columns]
    - path: models/marts/fct_orders.sql
      established: [simple upstream projection, explicit contract-aligned casts, date derived from timestamp]
  data_profiles:
    - subject: keys and source grains
      established: All four planned source keys are unique and non-null.
      evidence_type: warehouse aggregate profile
    - subject: relationship coverage
      established: Supplier, ingredient, potion, recipe, shop, and brew joins have zero unmatched rows.
      evidence_type: warehouse left-join profile
    - subject: supply-cost arithmetic
      established: 120 potion recipes with 2-5 ingredients; unit recipe costs range 356-9172 copper and batch costs 3560-541148 copper with zero nulls.
      evidence_type: warehouse reconciliation query

decisions:
  - id: decision_source_resolution
    question: Which raw relation is approved for the canonical migration build?
    evidence:
      - The user repaired the source declaration to ANALYTICS.DBT_RFRIEDMAN_MERLIN_DEV_RAW.
      - dbt show resolved the source successfully and returned 15 supplier rows with 15 distinct supplier IDs.
    options:
      - id: fixed_development_fixture
        implication: The migration is executable in the current workshop development environment; other environments must configure their own source relation.
    owner: analytics_engineering
    status: approved
    approved_value: fixed_development_fixture
    rationale: The user supplied and validated the intended workshop source schema for this migration.

  - id: decision_public_interfaces
    question: Approve the exact canonical dim_suppliers and fct_brews public columns defined in this spec?
    evidence:
      - The proposed columns preserve approved source attributes and expose copper plus number(38,2) gold costs.
      - fct_brews preserves all brew events and keeps nullable brew_duration_minutes nullable.
    options:
      - id: approve_full_interfaces
        implication: Publish operational brew context plus unit-recipe and batch supply costs in copper and gold.
      - id: narrower_interfaces
        implication: Requires identifying fields to remove and rerunning contract, lineage, and acceptance coherence checks.
    owner: data_product_owner
    status: approved
    approved_value: approve_full_interfaces
    rationale: The user explicitly approved the explained full interfaces after reviewing the exact model and column changes.


models:
  - name: stg_alembic_ops__suppliers
    layer: staging
    path: models/staging/alembic_ops/stg_alembic_ops__suppliers.sql
    properties_path: models/staging/alembic_ops/_stg_alembic_ops.yml
    materialized: view
    description_requirement: One row per supplier with typed rating and contract date.
    grain: {description: one row per supplier, key: [supplier_id]}
    inputs:
      - source: {name: alembic_ops, table: raw_suppliers}
    implementation:
      cte_shape: [source, renamed, final]
      joins: forbidden
      transformations: [reliability_rating to integer, contracted_since to date]
      join_contracts: []
      aggregation: null
    output_columns:
      - {name: supplier_id, logical_type: varchar, source: raw_suppliers.supplier_id, derived_from: null}
      - {name: supplier_name, logical_type: varchar, source: raw_suppliers.supplier_name, derived_from: null}
      - {name: region, logical_type: varchar, source: raw_suppliers.region, derived_from: null}
      - {name: reliability_rating, logical_type: integer, source: null, derived_from: raw_suppliers.reliability_rating::integer}
      - {name: contracted_since, logical_type: date, source: null, derived_from: raw_suppliers.contracted_since::date}
    properties:
      description: One row per ingredient supplier.
      model_data_tests: []
      columns:
        - {name: supplier_id, data_type: null, description: Primary key - supplier identifier., data_tests: [unique, not_null]}
        - {name: supplier_name, data_type: null, description: Supplier display name., data_tests: [not_null]}
        - {name: region, data_type: null, description: Supplier region., data_tests: [not_null]}
        - {name: reliability_rating, data_type: null, description: Reliability rating from 1 to 5., data_tests: [not_null]}
        - {name: contracted_since, data_type: null, description: Date the supplier contract began., data_tests: [not_null]}
    contract: {enforced: false}
    acceptance_checks: [row count equals raw_suppliers, supplier_id unique and non-null, reliability_rating between 1 and 5]

  - name: stg_alembic_ops__ingredients
    layer: staging
    path: models/staging/alembic_ops/stg_alembic_ops__ingredients.sql
    properties_path: models/staging/alembic_ops/_stg_alembic_ops.yml
    materialized: view
    description_requirement: One row per ingredient with normalized unit and hazardous flag and copper/gold unit cost.
    grain: {description: one row per ingredient, key: [ingredient_id]}
    inputs:
      - source: {name: alembic_ops, table: raw_ingredients}
    implementation:
      cte_shape: [source, renamed, final]
      joins: forbidden
      transformations: [lower trim unit, integer copper cost, copper_to_gold unit cost, to_boolean is_hazardous, lower trim harvest_season]
      join_contracts: []
      aggregation: null
    output_columns:
      - {name: ingredient_id, logical_type: varchar, source: raw_ingredients.ingredient_id, derived_from: null}
      - {name: ingredient_name, logical_type: varchar, source: raw_ingredients.ingredient_name, derived_from: null}
      - {name: supplier_id, logical_type: varchar, source: raw_ingredients.supplier_id, derived_from: null}
      - {name: unit, logical_type: varchar, source: null, derived_from: lower(trim(raw_ingredients.unit))}
      - {name: unit_cost_copper, logical_type: integer, source: null, derived_from: raw_ingredients.unit_cost_copper::integer}
      - {name: unit_cost_gold, logical_type: number(38,2), source: null, derived_from: copper_to_gold(raw_ingredients.unit_cost_copper)}
      - {name: is_hazardous, logical_type: boolean, source: null, derived_from: to_boolean(raw_ingredients.is_hazardous)}
      - {name: harvest_season, logical_type: varchar, source: null, derived_from: lower(trim(raw_ingredients.harvest_season))}
    properties:
      description: One row per ingredient with normalized procurement attributes and unit cost.
      model_data_tests: []
      columns:
        - {name: ingredient_id, data_type: null, description: Primary key - ingredient identifier., data_tests: [unique, not_null]}
        - {name: ingredient_name, data_type: null, description: Ingredient display name., data_tests: [not_null]}
        - name: supplier_id
          data_type: null
          description: FK to the ingredient supplier.
          data_tests:
            - not_null
            - relationships: {arguments: {to: "ref('stg_alembic_ops__suppliers')", field: supplier_id}}
        - name: unit
          data_type: null
          description: Lowercased ingredient measurement unit.
          data_tests:
            - not_null
            - accepted_values: {arguments: {values: [bundle, dram, gram, pinch, sprig, vial]}}
        - {name: unit_cost_copper, data_type: null, description: Current unit cost in copper pieces., data_tests: [not_null]}
        - {name: unit_cost_gold, data_type: null, description: Current unit cost in gold crowns., data_tests: [not_null]}
        - {name: is_hazardous, data_type: null, description: Whether the ingredient is hazardous., data_tests: [not_null]}
        - name: harvest_season
          data_type: null
          description: Lowercased harvest season.
          data_tests:
            - not_null
            - accepted_values: {arguments: {values: [autumn, spring, summer, winter, year-round]}}
    contract: {enforced: false}
    acceptance_checks: [row count equals raw_ingredients, ingredient_id unique and non-null, every supplier_id matches staging suppliers, no unmapped hazardous value]

  - name: stg_alembic_ops__potion_ingredients
    layer: staging
