    properties_path: models/staging/alembic_ops/_stg_alembic_ops.yml
    materialized: view
    description_requirement: One row per brew event with typed timestamps and measures and normalized quality result.
    grain: {description: one row per brew event, key: [brew_id]}
    inputs:
      - source: {name: alembic_ops, table: raw_brew_events}
    implementation:
      cte_shape: [source, renamed, final]
      joins: forbidden
      transformations: [brewed_at to timestamp_ntz, batch_size to integer, brew_duration_minutes to integer preserving nulls, lower trim quality_check]
      join_contracts: []
      aggregation: null
    output_columns:
      - {name: brew_id, logical_type: varchar, source: raw_brew_events.brew_id, derived_from: null}
      - {name: potion_sku, logical_type: varchar, source: raw_brew_events.potion_sku, derived_from: null}
      - {name: shop_id, logical_type: varchar, source: raw_brew_events.shop_id, derived_from: null}
      - {name: cauldron_id, logical_type: varchar, source: raw_brew_events.cauldron_id, derived_from: null}
      - {name: brewed_at, logical_type: timestamp_ntz, source: null, derived_from: raw_brew_events.brewed_at::timestamp_ntz}
      - {name: batch_size, logical_type: integer, source: null, derived_from: raw_brew_events.batch_size::integer}
      - {name: brew_duration_minutes, logical_type: integer, source: null, derived_from: raw_brew_events.brew_duration_minutes::integer}
      - {name: quality_check, logical_type: varchar, source: null, derived_from: lower(trim(raw_brew_events.quality_check))}
      - {name: brewer_name, logical_type: varchar, source: raw_brew_events.brewer_name, derived_from: null}
    properties:
      description: Production batches at one row per brew event.
      model_data_tests: []
      columns:
        - {name: brew_id, data_type: null, description: Primary key - brew event identifier., data_tests: [unique, not_null]}
        - name: potion_sku
          data_type: null
          description: FK to the potion brewed.
          data_tests:
            - not_null
            - relationships: {arguments: {to: "ref('stg_abra_pos__potions')", field: potion_sku}}
        - name: shop_id
          data_type: null
          description: FK to the brewing shop.
          data_tests:
            - not_null
            - relationships: {arguments: {to: "ref('stg_alembic_ops__shops')", field: shop_id}}
        - {name: cauldron_id, data_type: null, description: Operational cauldron identifier., data_tests: [not_null]}
        - {name: brewed_at, data_type: null, description: Brew timestamp., data_tests: [not_null]}
        - {name: batch_size, data_type: null, description: Potion units produced in the batch., data_tests: [not_null]}
        - {name: brew_duration_minutes, data_type: null, description: Brew duration in minutes; nullable in the source., data_tests: []}
        - name: quality_check
          data_type: null
          description: Lowercased quality result.
          data_tests:
            - not_null
            - accepted_values: {arguments: {values: [fail, pass]}}
        - {name: brewer_name, data_type: null, description: Name of the brewer., data_tests: [not_null]}
    contract: {enforced: false}
    acceptance_checks: [row count equals raw_brew_events, brew_id unique and non-null, quality domain is fail or pass, null brew duration count is preserved]

  - name: int_potion_supply_cost
    layer: intermediate
    path: models/intermediate/int_potion_supply_cost.sql
    properties_path: models/intermediate/_int.yml
    materialized: ephemeral
    description_requirement: One row per potion with standard ingredient supply cost from recipe quantities and current unit costs.
    grain: {description: one row per potion recipe, key: [potion_sku]}
    inputs:
      - {ref: stg_alembic_ops__potion_ingredients}
      - {ref: stg_alembic_ops__ingredients}
    implementation:
      cte_shape: [potion_ingredients, ingredients, joined, final]
      joins: required
      transformations: [multiply recipe quantity by current ingredient unit cost, aggregate to potion]
      join_contracts:
        - {left_input: stg_alembic_ops__potion_ingredients, right_input: stg_alembic_ops__ingredients, condition: potion_ingredients.ingredient_id = ingredients.ingredient_id, cardinality: many_to_one, join_type: inner, record_retention: preserve every recipe component, fanout_control: aggregate by potion_sku after the validated many-to-one join}
      aggregation:
        input_grain: one row per potion and ingredient
        output_grain: one row per potion
        group_by: [potion_sku]
        measures:
          - {name: ingredient_count, rule: count(*)}
          - {name: supply_cost_per_potion_copper, rule: sum(quantity * unit_cost_copper)}
          - {name: supply_cost_per_potion_gold, rule: round(supply_cost_per_potion_copper / 100.0, 2)}
    output_columns:
      - {name: potion_sku, logical_type: varchar, source: stg_alembic_ops__potion_ingredients.potion_sku, derived_from: null}
      - {name: ingredient_count, logical_type: integer, source: null, derived_from: count recipe components}
      - {name: supply_cost_per_potion_copper, logical_type: integer, source: null, derived_from: sum(recipe quantity * ingredient unit_cost_copper)}
      - {name: supply_cost_per_potion_gold, logical_type: number(38,2), source: null, derived_from: copper_to_gold(supply_cost_per_potion_copper)}
    properties:
      description: Standard ingredient supply cost at one row per potion recipe.
      model_data_tests: []
      columns:
        - {name: potion_sku, data_type: null, description: Primary key - potion SKU., data_tests: [unique, not_null]}
        - {name: ingredient_count, data_type: null, description: Number of ingredients in the recipe., data_tests: [not_null]}
        - {name: supply_cost_per_potion_copper, data_type: null, description: Current standard recipe cost for one potion in copper., data_tests: [not_null]}
        - {name: supply_cost_per_potion_gold, data_type: null, description: Current standard recipe cost for one potion in gold., data_tests: [not_null]}
    contract: {enforced: false}
    acceptance_checks: [one row per potion_sku, 2-5 ingredients per potion, copper cost reconciles to recipe detail, gold cost equals copper divided by 100]

  - name: int_brews_with_supply_cost
    layer: intermediate
    path: models/intermediate/int_brews_with_supply_cost.sql
    properties_path: models/intermediate/_int.yml
    materialized: ephemeral
    description_requirement: Brew-event grain enriched with standard per-potion and batch ingredient supply cost while preserving every brew.
    grain: {description: one row per brew event, key: [brew_id]}
    inputs:
      - {ref: stg_alembic_ops__brew_events}
      - {ref: int_potion_supply_cost}
    implementation:
      cte_shape: [brew_events, potion_supply_cost, final]
      joins: required
      transformations: [left join cost by potion_sku, multiply batch_size by per-potion cost, derive brewed_date]
      join_contracts:
        - {left_input: stg_alembic_ops__brew_events, right_input: int_potion_supply_cost, condition: brew_events.potion_sku = potion_supply_cost.potion_sku, cardinality: many_to_one, join_type: left, record_retention: preserve every brew event, fanout_control: right input unique by potion_sku}
      aggregation: null
    output_columns:
      - {name: brew_id, logical_type: varchar, source: stg_alembic_ops__brew_events.brew_id, derived_from: null}
      - {name: potion_sku, logical_type: varchar, source: stg_alembic_ops__brew_events.potion_sku, derived_from: null}
      - {name: shop_id, logical_type: varchar, source: stg_alembic_ops__brew_events.shop_id, derived_from: null}
      - {name: cauldron_id, logical_type: varchar, source: stg_alembic_ops__brew_events.cauldron_id, derived_from: null}
      - {name: brewer_name, logical_type: varchar, source: stg_alembic_ops__brew_events.brewer_name, derived_from: null}
      - {name: quality_check, logical_type: varchar, source: stg_alembic_ops__brew_events.quality_check, derived_from: null}
      - {name: batch_size, logical_type: integer, source: stg_alembic_ops__brew_events.batch_size, derived_from: null}
      - {name: brew_duration_minutes, logical_type: integer, source: stg_alembic_ops__brew_events.brew_duration_minutes, derived_from: null}
      - {name: supply_cost_per_potion_copper, logical_type: integer, source: int_potion_supply_cost.supply_cost_per_potion_copper, derived_from: null}
      - {name: supply_cost_per_potion_gold, logical_type: number(38,2), source: int_potion_supply_cost.supply_cost_per_potion_gold, derived_from: null}
      - {name: batch_supply_cost_copper, logical_type: integer, source: null, derived_from: batch_size * supply_cost_per_potion_copper}
      - {name: batch_supply_cost_gold, logical_type: number(38,2), source: null, derived_from: copper_to_gold(batch_supply_cost_copper)}
      - {name: brewed_at, logical_type: timestamp_ntz, source: stg_alembic_ops__brew_events.brewed_at, derived_from: null}
      - {name: brewed_date, logical_type: date, source: null, derived_from: brewed_at::date}
    properties:
      description: Brew-event grain enriched with standard ingredient supply cost.
      model_data_tests: []
      columns:
        - {name: brew_id, data_type: null, description: Primary key - brew event identifier., data_tests: [unique, not_null]}
        - {name: batch_supply_cost_copper, data_type: null, description: Standard ingredient supply cost for the full batch in copper., data_tests: [not_null]}
        - {name: batch_supply_cost_gold, data_type: null, description: Standard ingredient supply cost for the full batch in gold., data_tests: [not_null]}
    contract: {enforced: false}
    acceptance_checks: [8000 brew rows retained, brew_id unique, no null supply costs, batch cost equals batch_size times per-potion cost]

  - name: dim_suppliers
    layer: marts
    path: models/marts/dim_suppliers.sql
    properties_path: models/marts/_marts.yml
    materialized: table
    description_requirement: Contracted supplier dimension at one row per supplier.
    grain: {description: one row per supplier, key: [supplier_id]}
    inputs:
      - {ref: stg_alembic_ops__suppliers}
    implementation:
      cte_shape: [suppliers, final]
      joins: forbidden
      transformations: [explicit contract-aligned casts only]
      join_contracts: []
      aggregation: null
    output_columns:
      - {name: supplier_id, logical_type: varchar, source: stg_alembic_ops__suppliers.supplier_id, derived_from: null}
      - {name: supplier_name, logical_type: varchar, source: stg_alembic_ops__suppliers.supplier_name, derived_from: null}
