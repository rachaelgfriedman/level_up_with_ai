    properties_path: models/staging/alembic_ops/_stg_alembic_ops.yml
    materialized: view
    description_requirement: One row per potion and ingredient recipe component with typed quantity and normalized unit.
    grain: {description: one row per potion and ingredient, key: [potion_sku, ingredient_id]}
    inputs:
      - source: {name: alembic_ops, table: raw_potion_ingredients}
    implementation:
      cte_shape: [source, renamed, final]
      joins: forbidden
      transformations: [quantity to integer, lower trim unit]
      join_contracts: []
      aggregation: null
    output_columns:
      - {name: potion_sku, logical_type: varchar, source: raw_potion_ingredients.potion_sku, derived_from: null}
      - {name: ingredient_id, logical_type: varchar, source: raw_potion_ingredients.ingredient_id, derived_from: null}
      - {name: quantity, logical_type: integer, source: null, derived_from: raw_potion_ingredients.quantity::integer}
      - {name: unit, logical_type: varchar, source: null, derived_from: lower(trim(raw_potion_ingredients.unit))}
    properties:
      description: Recipe bridge at one row per potion and ingredient.
      model_data_tests:
        - dbt_utils.unique_combination_of_columns: {arguments: {combination_of_columns: [potion_sku, ingredient_id]}}
      columns:
        - name: potion_sku
          data_type: null
          description: Potion SKU in the recipe.
          data_tests:
            - not_null
            - relationships: {arguments: {to: "ref('stg_abra_pos__potions')", field: potion_sku}}
        - name: ingredient_id
